name: Update File Hash

on:
#  schedule:
#    - cron: '0 * * * *' # runs hourly at midnight UTC
  workflow_dispatch: # so it can run manually
  repository_dispatch:
    types:
      - discordo-ci-completed # Triggered by another repository's GitHub Actions
jobs:
  update-hash:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Wait for nightly.link
      run: |
        sleep 300

    - name: Download ZIP files
      run: |
        curl -L -O https://nightly.link/ayn2op/discordo/workflows/ci/main/discordo_Windows_X64.zip
        curl -L -O https://nightly.link/ayn2op/discordo/workflows/ci/main/discordo_Windows_ARM64.zip

    - name: Calculate hashes of ZIP files
      id: calculate-hash
      run: |
        HASH_X64=$(sha256sum discordo_Windows_X64.zip | awk '{ print $1 }')
        HASH_ARM64=$(sha256sum discordo_Windows_ARM64.zip | awk '{ print $1 }')
        echo "HASH_X64=$HASH_X64" >> $GITHUB_ENV
        echo "HASH_ARM64=$HASH_ARM64" >> $GITHUB_ENV

    - name: Update hashes in JSON file
      run: |
        jq --arg x64 "$HASH_X64" --arg arm64 "$HASH_ARM64" '
          .architecture["64bit"].hash = $x64 |
          .architecture["arm64"].hash = $arm64
        ' bucket/discordo.json > tmp.json && mv tmp.json bucket/discordo.json

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if ! git diff --exit-code bucket/discordo.json; then
          git add bucket/discordo.json
          git commit -m "Update hash in discordo.json"
          git push
        else
          echo "No changes to commit."
        fi
